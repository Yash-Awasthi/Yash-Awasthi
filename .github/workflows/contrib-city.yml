name: Generate 3D Contribution City

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Least privilege by default: jobs that need to write opt in at job level.
permissions:
  contents: read

# A manual run must not race the cron: one run at a time, the queued one supersedes.
concurrency:
  group: contrib-city
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: python3 .github/city.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "assets unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Update contribution city"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD~1)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "::error::origin/$GITHUB_REF_NAME moved since checkout; refusing to push a stale city"
            exit 1
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
