name: Quarterly claim audit

# The four checks in docs/AUDIT.md, run on a schedule so that "I forgot to look"
# cannot be the reason a dead project stays on the profile.
on:
  schedule:
    - cron: "0 7 1 */3 *" # 07:00 UTC on the first of January, April, July and October
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Every claim still sits on its pinned line
        run: python3 scripts/pin_claims.py --check

      - name: Every snippet and every live URL still answers
        run: python3 scripts/check_claims.py --links

      - name: Number, live link, licence and last commit date for every project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/audit_claims.py --links --fail-on-stale
