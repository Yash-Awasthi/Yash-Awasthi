name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%233d5bd9&color_dots=%23e3e9ec,%23b9dcd8,%237fc0b9,%232a8f8a,%23205f73
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%235b8def&color_dots=%23161b22,%2314403f,%231d6b68,%232a8f8a,%2366c2b8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
